function returnToTitle(){playing=false;pointer=false;boss=null;bullets=[];arrows=[];enemies=[];heading.textContent='🏹 蒼天のエル';message.innerHTML='青空を駆ける弓使いの冒険！<br>指で移動・光の矢は自動発射。<br>難易度を選んで再出発しよう！';start.textContent='冒険を始める';panel.classList.remove('hidden');}

function burst(x,y,c,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*170;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.35+Math.random()*.55,c,r:2+Math.random()*4})}}

function finish(win){playing=false;heading.textContent=win?'🏆 ボス撃破！':'💫 ゲームオーバー';message.innerHTML='スコア：<b>'+score.toLocaleString()+'</b><br>'+(win?'天空を守り抜いた！':'もう一度挑戦しよう！');start.textContent='この難易度で再挑戦';panel.classList.remove('hidden')}
function update(dt){if(victoryDelay>0){victoryDelay-=dt;elapsed+=dt;scroll+=dt*45;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);for(const e of explosions)e.t+=dt;explosions=explosions.filter(e=>e.t<e.duration);if(victoryDelay<=0)finish(true);return;}elapsed+=dt;scroll+=dt*65;inv=Math.max(0,inv-dt);if(pointer){player.x+=(target.x-player.x)*(1-Math.exp(-dt*13));player.y+=(target.y-player.y)*(1-Math.exp(-dt*13))}let speed=300;if(keys.ArrowUp||keys.w)player.y-=speed*dt;if(keys.ArrowDown||keys.s)player.y+=speed*dt;if(keys.ArrowLeft||keys.a)player.x-=speed*dt;if(keys.ArrowRight||keys.d)player.x+=speed*dt;player.x=Math.max(55,Math.min(W*.72,player.x));player.y=Math.max(45,Math.min(H-45,player.y));

for(const a of arrows){a.x+=a.v*dt;for(const e of enemies){if(e.hp>0&&Math.hypot(a.x-e.x,a.y-e.y)<e.r+8){e.hp-=a.d;a.x=W+500;if(e.hp<=0){score+=e.large?200:100;burst(e.x,e.y,'#a7e7ff')}}}if(boss&&Math.hypot(a.x-boss.x,a.y-boss.y)<boss.r+5){boss.hp-=a.d;a.x=W+500;burst(boss.x-30,a.y,'#ffe9a0',2);if(boss.hp<=0){score+=3000;explosions.push({x:boss.x,y:boss.y,t:0,duration:2.2,r:boss.r});for(let j=0;j<7;j++)burst(boss.x+(Math.random()-.5)*120,boss.y+(Math.random()-.5)*120,j%2?'#ff9e35':'#fff3ad',24);boss=null;bullets=[];enemies=[];victoryDelay=2.3}}}

arrows=arrows.filter(a=>a.x<W+60);enemies=enemies.filter(e=>e.hp>0&&e.x>-50);bullets=bullets.filter(b=>b.x>-30&&b.y>-30&&b.y<H+30);particles=particles.filter(p=>p.t>0)}

if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowBlur=32;ctx.shadowColor='#ff78f5';ctx.fillStyle='#4c185d';ctx.strokeStyle='#ffa9f1';ctx.lineWidth=6;ctx.beginPath();for(let j=0;j<12;j++){let a=j*Math.PI/6,r=j%2?boss.r*.8:boss.r*1.22;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#f8d8ff';ctx.beginPath();ctx.arc(-23,-9,12,0,7);ctx.arc(23,-9,12,0,7);ctx.fill();ctx.fillStyle='#ff386f';ctx.beginPath();ctx.arc(-23,-9,5,0,7);ctx.arc(23,-9,5,0,7);ctx.fill();ctx.restore();ctx.fillStyle='#1d214caa';ctx.fillRect(W*.25,15,W*.5,18);ctx.fillStyle='#ff76bb';ctx.fillRect(W*.25,15,W*.5*Math.max(0,boss.hp/boss.max),18);ctx.strokeStyle='#fff';ctx.strokeRect(W*.25,15,W*.5,18);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText('巨大ボス',W*.5,47)}
for(const b of bullets){ctx.fillStyle=b.small?'#ffcf43':'#ff4da4';ctx.shadowColor='#ff8ac4';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0}
for(const a of arrows){ctx.strokeStyle='#fff9a5';ctx.shadowColor='#fff5a0';ctx.shadowBlur=13;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a.x-27,a.y);ctx.lineTo(a.x+13,a.y);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(a.x+20,a.y);ctx.lineTo(a.x+7,a.y-7);ctx.lineTo(a.x+7,a.y+7);ctx.fill()}
if(inv<=0||Math.floor(inv*8)%2===0){
ctx.save();
const bob=Math.sin(elapsed*4)*2.2, wind=elapsed*5.5;
ctx.translate(player.x,player.y+bob);ctx.rotate(player.tilt);
const k=.66;ctx.scale(k,k);
const phase=(1-Math.max(0,shot)/shotCycle);
const drawAmount=phase<.72?Math.sin(phase/.72*Math.PI/2):Math.max(0,1-(phase-.72)/.22);
const sway=Math.sin(wind)*3;
function path(points,fill,stroke,width=1){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function stroke(points,color,width){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function grad(x1,y1,x2,y2,stops){const g=ctx.createLinearGradient(x1,y1,x2,y2);for(const [at,color] of stops)g.addColorStop(at,color);return g}
const silk=grad(-55,-25,15,30,[[0,'#f9fdff'],[.4,'#d5e2f0'],[.8,'#8d9db9'],[1,'#eef5ff']]);
const hair=grad(-20,-54,18,-20,[[0,'#c5fff8'],[.3,'#39e6df'],[.7,'#088eac'],[1,'#064d72']]);
const dress=grad(-20,-20,22,25,[[0,'#d1f9ff'],[.22,'#69ced9'],[.55,'#216d8d'],[.85,'#3994ad'],[1,'#8de5e7']]);
const gold=grad(-25,-20,35,0,[[0,'#ffeab1'],[.4,'#b77a24'],[.7,'#ffdc6c'],[1,'#805b28']]);

 ctx.bezierCurveTo(x0-len*.28,y0-width*.4+shift,x0-len*.64,y0-width*.6-shift,x0-len,y0+shift*.8);

 ctx.closePath();ctx.fillStyle=color;ctx.fill()
}
// Cape: layered fluttering cloth, anchored to both shoulders.
ribbon(-7,-13,86,36,silk,Math.sin(wind*.8)*10);
ribbon(-8,-10,70,30,'#e7f3ff',Math.sin(wind*.8+1)*9);
ribbon(-9,0,81,22,'#a8bbd6',Math.sin(wind*.9+2)*8);

stroke([[-15,-11],[-23,-43]],'#7c92b1',5);
stroke([[-23,-43],[-29,-55]],'#e7f7ff',2);

for(let i=0;i<5;i++){
 let y=-31+i*5,off=Math.sin(wind*.7+i*.8)*4;
 ribbon(-8,y,24+i*3,7,i%2?'#20c4b9':'#4ce4d2',off);
}
// Neck, face, ears.
circle(0,-31,14,grad(-13,-45,14,-20,[[0,'#fff1ee'],[.55,'#f3d5dc'],[1,'#ba889c']]));
path([[-13,-33],[-20,-36],[-15,-27]],'#e9c4d0');
path([[13,-33],[20,-36],[15,-27]],'#e9c4d0');
circle(-5,-31,2.3,'#f5ffff');circle(6,-31,2.3,'#f5ffff');circle(-4.5,-31,1.5,'#167b7d');circle(6.5,-31,1.5,'#167b7d');circle(-4.2,-31.6,.65,'#fff');circle(6.8,-31.6,.65,'#fff');

path([[-15,-37],[-13,-49],[-5,-53],[8,-51],[16,-43],[14,-31],[9,-37],[7,-31],[2,-39],[-3,-32],[-8,-40],[-14,-30]],hair,'#9bfaf0',.8);
for(let i=0;i<4;i++){
 const x=-14+i*9,delta=Math.sin(wind*.9+i)*2.7;
 stroke([[x,-45],[x+delta,-32],[x-2+delta*1.5,-23+i%2*3]],i%2?'#39e8d3':'#0ea99f',3.4);

// Fine highlights on clothing and fluttering cape.

const frontShoulder={x:10,y:-14},frontElbow={x:23+drawAmount*2,y:-15},frontHand={x:bowX-2,y:bowY};

ctx.shadowColor='#f3e7b3';ctx.shadowBlur=7;

}
for(const ex of explosions){let t=ex.t/ex.duration;ctx.save();ctx.translate(ex.x,ex.y);ctx.globalAlpha=Math.max(0,1-t);let radius=20+t*180;let rg=ctx.createRadialGradient(0,0,0,0,0,radius);rg.addColorStop(0,'#ffffff');rg.addColorStop(.19,'#fff4a2');rg.addColorStop(.48,'#ff8a2b');rg.addColorStop(.75,'#db3351');rg.addColorStop(1,'#ed335100');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff4bd';ctx.lineWidth=7*(1-t)+1;ctx.beginPath();ctx.arc(0,0,radius*1.2,0,Math.PI*2);ctx.stroke();ctx.restore();}
